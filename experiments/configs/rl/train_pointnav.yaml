# Script config for scripts/train_pointnav.py — plain YAML (PyYAML), NOT a Hydra config.
# Holds every value the script would otherwise hardcode; the task/PPO hyperparameters live in the Hydra
# config named below (pointnav_continuous.yaml). Override any key from the CLI with
#   --set modality=depth --set eval=true
# and pass extra Hydra overrides for the habitat config with --habitat-set (or `habitat_overrides` here).

# The Hydra config composed by habitat_baselines.config.default.get_config.
habitat_config:
  config_name: rl/pointnav_continuous.yaml
  configs_dir: experiments/configs

# Extra Hydra overrides applied to that config, e.g. ["habitat_baselines.total_num_steps=2000"].
# --habitat-set VALUES are appended to this list.
habitat_overrides: []

# Evaluate a checkpoint instead of training (--eval sets this to true). The override below is what
# switches habitat-baselines into eval mode.
eval: false
eval_override: habitat_baselines.evaluate=True

# Visual input for the policy. rgb matches the project's RGB-first thesis; depth/rgbd are stronger but
# off-thesis. `modalities` maps each choice to the sim_sensors removed from the composed config —
# done in code (see prepare_config) because pointnav_hm3d re-adds the depth sensor in its own body.
modality: rgb
modalities:
  rgb: [depth_sensor]
  depth: [rgb_sensor]
  rgbd: []

# Discrete actions removed so the action space is purely continuous velocity control, and the action
# set the script asserts is left afterwards.
discrete_actions: [stop, move_forward, turn_left, turn_right]
expected_actions: [velocity_control]

# Override habitat.dataset.data_path — set here rather than as a Hydra override because it contains
# `{split}` braces the Hydra CLI parser rejects. null = keep whatever the Hydra config specifies.
data_path: null
