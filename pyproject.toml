[project]
name = "foresight"
version = "0.1.0"
description = "Map-free monocular navigation with an on-board VLM, evaluated in Habitat-Sim"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
